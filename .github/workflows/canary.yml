# The end-to-end check (tools/sandbox/e2e.py) against the newest OpenCode: weekly, so an OpenCode
# update that changes how a limit stop looks shows up here and not as a missed night; and on pull
# requests that touch what it covers.
name: canary

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays, 05:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/canary.yml
      - tools/sandbox/**
      - tools/fakemeridian/**
      - internal/fakemeridian/**
      - internal/opencode/**
      - internal/daemon/**

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install the newest OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash -s -- --no-modify-path
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
      - run: opencode --version
      - run: python3 -I tools/sandbox/e2e.py
      - name: Logs of the failed run
        if: failure()
        run: tail -n 100 /tmp/opencode/lga-sandbox/lga/daemon.log /tmp/opencode/lga-sandbox/fake.log || true
