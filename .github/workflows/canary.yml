# The end-to-end check (tools/sandbox/e2e.py) against the newest OpenCode, weekly, so an OpenCode
# update that changes how a limit stop looks shows up here and not as a missed night. By hand for a
# branch: gh workflow run canary --ref <branch>. release.yml runs the same steps before every release.
name: canary

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # opencode.ai/install installs only OpenCode 1; OpenCode 2 has its own installer.
      - name: Install the newest OpenCode 2
        run: |
          curl -fsSL https://opencode.ai/v2/install | bash -s -- --no-modify-path
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
      - run: opencode --version
      - run: python3 -I tools/sandbox/e2e.py
      - name: Logs of the failed run
        if: failure()
        run: |
          cd /tmp/opencode/lga-sandbox || exit 0
          sed -E 's/(password ).*/\1<redacted>/' serve.log | tail -n 60 || true
          tail -n 100 lga/daemon.log fake.log || true
