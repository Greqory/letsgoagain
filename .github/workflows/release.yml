name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: tools/check.sh
      # The end-to-end check, as in canary.yml: no release that doesn't work with the newest OpenCode.
      - name: Install the newest OpenCode 2
        run: |
          curl -fsSL https://opencode.ai/v2/install | bash -s -- --no-modify-path
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
      - run: opencode --version
      - run: python3 -I tools/sandbox/e2e.py
      - name: Logs of the failed end-to-end run
        if: failure()
        run: |
          cd /tmp/opencode/lga-sandbox || exit 0
          sed -E 's/(password ).*/\1<redacted>/' serve.log | tail -n 60 || true
          tail -n 100 lga/daemon.log fake.log || true
      - name: Build
        env:
          CGO_ENABLED: "0"
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$TAG" \
              -o "dist/letsgoagain_linux_$arch" ./cmd/letsgoagain
          done
          (cd dist && sha256sum letsgoagain_linux_* > checksums.txt)
          cat dist/checksums.txt
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "$TAG" --generate-notes
